<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hub - Secure Stream</title>
    <style>
        body {
            margin: 0; background-color: #0a0a0a; color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .box-error {
            text-align: center; padding: 2rem; max-width: 400px;
            background-color: #171717; border: 1px solid #262626;
            border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            margin: 1rem;
        }
        .text-red { color: #ef4444; font-size: 1.5rem; font-weight: bold; margin: 0; }
        .text-gray { color: #a3a3a3; font-size: 0.875rem; margin-top: 0.75rem; }
        .text-footer { color: #737373; font-size: 0.75rem; font-family: monospace; margin-top: 0.25rem; }
        .border-top { border-top: 1px solid #262626; margin-top: 1.5rem; padding-top: 1rem; }
        .text-cyan { color: #22d3ee; }
        
        main { width: 100%; max-width: 32rem; padding: 1rem; }
        .card-3d {
            background-color: #171717; border: 1px solid #262626;
            border-radius: 1rem; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .viewer-container { width: 100%; height: 24rem; background-color: #0a0a0a; position: relative; }
        model-viewer { width: 100%; height: 100%; }
        .watermark {
            position: absolute; bottom: 1rem; right: 1rem;
            background-color: rgba(0,0,0,0.6); padding: 0.25rem 0.6rem;
            border-radius: 0.25rem; border: 1px solid #262626;
            color: #a3a3a3; font-size: 10px; font-family: monospace;
        }
    </style>
    
    <!-- PANGGIL FILE DAFTAR LIST KLIEN SECARA LOKAL -->
    <script src="configClient.js"></script>
    <script type="module" src="model-viewer.min.js"></script>
</head>
<body>

    <script>
        // 1. Ambil parameter dari link URL (?folder=...&file=...)
        const urlParams = new URLSearchParams(window.location.search);
        const folder = urlParams.get('folder'); 
        const file = urlParams.get('file');     

        if (!folder || !file) {
            blockAccess("Invalid request. No 3D asset parameter specified.");
        }

        // 2. JALANKAN CEK KEAMANAN BERDASARKAN DATA DARI CONFIG.JS
        if (window.self === window.top) {
            blockAccess("Direct sharing of this link is restricted. This viewer can only be embedded inside authorized client pages.");
        } else {
            const parentUrl = document.referrer;
            
            // Mengambil daftar list yang diatur di config.js
            const authorizedDomain = window.ACCESS_CONTROL_LIST ? window.ACCESS_CONTROL_LIST[folder] : null;

            if (!authorizedDomain || !parentUrl.includes(authorizedDomain)) {
                blockAccess("Unauthorized access. This domain is not permitted to load this specific 3D character asset.");
            }
        }

        function blockAccess(message) {
            document.body.innerHTML = `
                <div class="box-error">
                    <p class="text-red">🚫 Access Denied</p>
                    <p class="text-gray">${message}</p>
                    <div class="border-top">
                        <p class="text-footer">Secured by: Christino Malaysianto</p>
                        <p class="text-footer text-cyan" style="margin-top: 4px;">Contact: christino.malaysianto@gmail.com</p>
                    </div>
                </div>
            `;
            throw new Error("Security Lock Triggered.");
        }
    </script>

    <!-- CONTENT 3D UTAMA -->
    <main>
        <div class="card-3d">
            <div class="viewer-container">
                <script>
                    document.write(`
                        <model-viewer 
                            src="models/${folder}/${file}.glb" 
                            camera-controls 
                            auto-rotate 
                            interaction-prompt="none"
                            shadow-intensity="1">
                        </model-viewer>
                    `);
                </script>
                <span class="watermark">© Christino Malaysianto</span>
            </div>
        </div>
    </main>

</body>
</html>
