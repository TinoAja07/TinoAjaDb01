<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Character Showcase - Secure Access</title>
    
    <!-- HAPUS SCRIPT TAILWIND, GANTI DENGAN CSS INTERNAL YANG JAUH LEBIH ENTENG INI -->
    <style>
        body {
            margin: 0; background-color: #0a0a0a; color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .box-error {
            text-align: center; padding: 2rem; max-width: 400px;
            background-color: #171717; border: 1px solid #262626;
            border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            margin: 1rem;
        }
        .text-red { color: #ef4444; font-size: 1.5rem; font-weight: bold; margin: 0; }
        .text-gray { color: #a3a3a3; font-size: 0.875rem; margin-top: 0.75rem; }
        .text-footer { color: #737373; font-size: 0.75rem; font-family: monospace; margin-top: 0.25rem; }
        .border-top { border-top: 1px solid #262626; margin-top: 1.5rem; pt: 1rem; }
        .text-cyan { color: #22d3ee; }
        
        main { width: 100%; max-width: 32rem; padding: 1rem; }
        .card-3d {
            background-color: #171717; border: 1px solid #262626;
            border-radius: 1rem; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .viewer-container { width: 100%; height: 24rem; background-color: #0a0a0a; position: relative; }
        model-viewer { width: 100%; height: 100%; }
        .watermark {
            position: absolute; bottom: 1rem; right: 1rem;
            background-color: rgba(0,0,0,0.6); padding: 0.25rem 0.6rem;
            border-radius: 0.25rem; border: 1px solid #262626;
            color: #a3a3a3; font-size: 10px; font-family: monospace;
        }
    </style>

    <script type="module" src="model-viewer.min.js"></script>
</head>
<body>

    <!-- SECURITY CHECKS -->
    <script>
        const allowedDomains = [
            "://patreon.com",
            "://substack.com",
            "wordpress.com",
            "localhost"
        ];

        if (window.self === window.top) {
            blockAccess("Direct sharing of this link is restricted. This 3D viewer can only be viewed on authorized client pages.");
        } else {
            const parentUrl = document.referrer;
            const isAuthorized = allowedDomains.some(domain => parentUrl.includes(domain));
            if (!isAuthorized) {
                blockAccess("This 3D character viewer is not authorized to load on this domain.");
            }
        }

        function blockAccess(message) {
            document.body.innerHTML = `
                <div class="box-error">
                    <p class="text-red">🚫 Access Denied</p>
                    <p class="text-gray">${message}</p>
                    <div class="border-top">
                        <p class="text-footer">Created by: Christino Malaysianto</p>
                        <p class="text-footer text-cyan" style="margin-top: 4px;">Contact: christino.malaysianto@gmail.com</p>
                    </div>
                </div>
            `;
            throw new Error("Security Violation: Access Blocked.");
        }
    </script>

    <!-- CONTENT 3D UTAMA -->
    <main>
        <div class="card-3d">
            <div class="viewer-container">
                <model-viewer 
                    src="models/model1.glb" 
                    camera-controls 
                    auto-rotate 
                    interaction-prompt="none"
                    shadow-intensity="1">
                </model-viewer>
                <span class="watermark">© Christino Malaysianto</span>
            </div>
        </div>
    </main>

</body>
</html>
